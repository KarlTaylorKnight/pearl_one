[workspace]
resolver = "2"
members = [
    "crates/dwin_core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Allowed crates per spec
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
